<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B0F14">
  <meta name="description" content="GIRO — Sua oficina em movimento. Gestão de serviços, veículos e atendimento.">
  <title>GIRO | Gestão da oficina</title>
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("giro-theme"); } catch (e) {}
      if (!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", t);
      var mc = document.querySelector('meta[name="theme-color"]');
      if (mc) mc.setAttribute("content", t === "light" ? "#f0f2ed" : "#0b0f14");
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700;750;800;900&display=swap" rel="stylesheet">
  <link rel="icon" href="./mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./data.js?v=dashboard-patio-3"></script>
  <script defer src="./app.js?v=dashboard-patio-3"></script>
</head>
<body>
  <a class="skip-link" href="#main">Pular para o conteúdo</a>
  <div id="app"><div class="boot"><img src="./mark.svg" width="48" height="48" alt="GIRO"><p>Preparando sua oficina…</p><div class="skeleton"></div></div></div>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <div id="toasts" role="status" aria-live="polite"></div>
  <noscript>Ative o JavaScript para acessar o painel GIRO.</noscript>
</body>
</html>
